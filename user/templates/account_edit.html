{% extends "base.html" %}

{% block title %}
개인정보 수정 | 또롱이
{% endblock %}

{% block content %}
<section class="account-page">
    <div class="account-form-container">
        <div class="account-heading">
            <span>EDIT PROFILE</span>
            <h1>개인정보 수정</h1>
            <p>
                변경할 정보와 현재 비밀번호를 입력해 주세요.
            </p>
        </div>

        <form
            action="{{ url_for('account_edit') }}"
            method="post"
            class="account-form"
        >
            <label for="username">
                아이디
            </label>

            <input
                type="text"
                id="username"
                value="{{ account_user['username'] }}"
                disabled
            >

            <label for="name">
                닉네임
                <b>*</b>
            </label>

            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                value="{{ account_user['name'] }}"
                required
            >

            <label for="email">
                이메일
                <b>*</b>
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="190"
                value="{{ account_user['email'] }}"
                required
            >

            <label for="phone">
                휴대전화
                <b>*</b>
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                maxlength="13"
                value="{{ account_user['phone'] }}"
                placeholder="010-1234-5678"
                required
            >

            <label for="current_password">
                현재 비밀번호
                <b>*</b>
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                placeholder="개인정보 변경 확인용"
                required
            >

            <button type="submit">
                수정 내용 저장
            </button>
        </form>

        <a
            href="{{ url_for('account_profile') }}"
            class="account-back-link"
        >
            내 정보로 돌아가기
        </a>
    </div>
</section>
{% endblock %}
