{% extends "base.html" %}

{% block title %}
비밀번호 변경 | 또롱이
{% endblock %}

{% block content %}
<section class="account-page">
    <div class="account-form-container">
        <div class="account-heading">
            <span>CHANGE PASSWORD</span>
            <h1>비밀번호 변경</h1>
            <p>
                현재 비밀번호를 확인한 뒤 새 비밀번호를 설정합니다.
            </p>
        </div>

        <form
            action="{{ url_for('account_password') }}"
            method="post"
            class="account-form"
        >
            <label for="current_password">
                현재 비밀번호
                <b>*</b>
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
            >

            <label for="new_password">
                새 비밀번호
                <b>*</b>
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                placeholder="영문과 숫자를 포함해 8자 이상"
                required
            >

            <label for="new_password_confirm">
                새 비밀번호 확인
                <b>*</b>
            </label>

            <input
                type="password"
                id="new_password_confirm"
                name="new_password_confirm"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                비밀번호 변경
            </button>
        </form>

        <a
            href="{{ url_for('account_profile') }}"
            class="account-back-link"
        >
            내 정보로 돌아가기
        </a>
    </div>
</section>
{% endblock %}
