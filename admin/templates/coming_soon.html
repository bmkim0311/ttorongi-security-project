{% extends "base.html" %}

{% block title %}
    {{ page_title }} | 또롱이 관리자
{% endblock %}

{% block content %}
<section class="page-heading">
    <div>
        <span class="page-eyebrow">
            ADMINISTRATION
        </span>

        <h1>{{ page_title }}</h1>

        <p>{{ page_description }}</p>
    </div>
</section>

<section class="panel preparation-panel">
    <span class="preparation-number">NEXT</span>

    <h2>기능 연결 준비 완료</h2>

    <p>
        관리자 공통 인증과 메뉴 구조가 먼저 구성되었습니다.
        다음 단계에서 실제 조회, 등록, 수정 기능을 연결합니다.
    </p>

    <a
        href="{{ url_for('dashboard') }}"
        class="primary-button"
    >
        대시보드로 돌아가기
    </a>
</section>
{% endblock %}
